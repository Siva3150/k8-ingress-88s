apiVersion: apps/v1 
kind: Deployment 
metadata: 
 name: app-1  
# these are replica set labels
 labels: 
   purpose: ingress-demo
   project: roboshop
   app: app1
spec: 
 replicas: 2
 selector:
# these labels are used to select pods 
  matchLabels: 
   purpose: ingress-demo
   project: roboshop
   app: app1 
# pod definition
 template: 
  metadata: 
   labels: 
    purpose: ingress-demo
    project: roboshop
    app: app1
  spec: 
   containers: 
   - name: app-1  
     image: siva3150/app-1:v1 
     imagePullPolicy: Always  