apiVersion: apps/v1 
kind: Deployment 
metadata: 
 name: app-2  
# these are replica set labels
 labels: 
   purpose: ingress-demo
   project: roboshop
   app: app2
spec: 
 replicas: 2
 selector:
# these labels are used to select pods 
  matchLabels: 
   purpose: ingress-demo
   project: roboshop
   app: app2
# pod definition
 template: 
  metadata: 
   labels: 
    purpose: ingress-demo
    project: roboshop
    app: app2
  spec: 
   containers: 
   - name: app-2 
     image: siva3150/app-2:v1 
     imagePullPolicy: Always  

--- 

apiVersion: v1 
kind: Service 
metadata: 
 name: app-2  
spec: 
 selector:
  purpose: ingress-demo
  project: roboshop
  app: app2
 ports: 
 - protocol: TCP 
   port: 80 #service port 
   targetPort: 80 #container port 

--- 

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-2 
  annotations:
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS": 443}]'
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-1:445567085619:certificate/1f19a7d1-bc33-44af-ab0c-84f97d5d9d71
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/tags: Environment=dev,Project=roboshop
    alb.ingress.kubernetes.io/target-type: ip
    #alb.ingress.kubernetes.io/group.name: roboshop
spec:
  ingressClassName: alb
  rules:
  - host: "app2.sivadevops.space"
    http:
      paths:
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: app-2 
            port:
              number: 80